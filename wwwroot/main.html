<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="assets/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="d-flex flex-column">
        <div class="d-flex align-center">
            <h1>OpenClicker</h1>
            <div
                id="status"
                class="ml-auto"
                style="
                    height: 10px;
                    width: 10px;
                    border-radius: 50%;
                    background-color: #f00;
                "
            ></div>
        </div>

        <button
            id="btnSetHotkey"
            class="rounded"
            onclick="setKeybind()"
        >Tastenkombination setzen</button>

        <div class="d-flex mt-6">
            <!-- Clicks per second -->
             <div class="d-flex flex-column" style="width: 50%">
                <label for="cps">Klicks pro Sekunde</label>
                <input
                    id="cps"
                    class="rounded mr-2"
                    type="number"
                    name="cpsinput"
                    min="0"
                    max="10000"
                    step="1"
                    onchange="setCps()"
                />
             </div>


            <!-- Click duty -->
             <div class="d-flex flex-column" style="width: 50%">
                <label for="clickDuty">Klickgrad</label>
                <input
                    id="clickDuty"
                    class="rounded ml-2"
                    type="number"
                    name="clickDutyinput"
                    min="0"
                    max="100"
                    step="1"
                    onchange="setClickDuty()"
                />
             </div>
        </div>


        <!-- Mouse button -->
        <span class="mt-6 ml-4">Maustaste</span>
        <div class="d-flex" style="justify-content: space-between;">
            <label for="mbLeft">
                <input type="radio" id="mbLeft" name="mouseButton" value="0" onchange="setMouseButton(0)">Links
            </label>
            <label for="mbMiddle">
                <input type="radio" id="mbMiddle" class="" name="mouseButton" value="1" onchange="setMouseButton(1)">Mitte
            </label>
            <label for="mbRight">
                <input type="radio" id="mbRight" class="" name="mouseButton" value="2" onchange="setMouseButton(2)">Rechts
            </label>
        </div>
    </div>
</body>

<script>
    function setCps() {
        const cpsValue = document.querySelector('input[name="cpsinput"]').value;
        window.external.sendMessage(`setCps:${cpsValue}`);
    }

    function setClickDuty(value) {
        const clickdutyValue = document.querySelector('input[name="clickDutyinput"]').value;
        window.external.sendMessage(`setClickDuty:${clickdutyValue}`);
    }

    function setMouseButton(value) {
        window.external.sendMessage(`setMouseButton:${value}`);
    }

    function setKeybind() {
        const btn = document.getElementById('btnSetHotkey');
        btn.disabled = true;
        btn.innerText = "Drücke eine Tastenkombination..."
        window.external.sendMessage("setKeybind");
    }

    window.external.receiveMessage((message) => {
        try {
            const data = JSON.parse(message);

            if (data.type === "title") {
                document.getElementById("headline").innerText = data.text;
                return;
            }

            if (data.type === "status") {
                document.getElementById("status").style.backgroundColor =
                    data.state === 1 ? "#0F0" : "#F00";
                return;
            }

            if (data.type === "cps") {
                document.getElementById("cps").textContent = data.text;
                return;
            }

            if (data.type === "keybind") {
                const btn = document.getElementById('btnSetHotkey');
                btn.innerText = data.text.replace(/^Hotkey set to:\s*/, "Hotkey: ");

                if (/^Hotkey set to:/i.test(data.text))
                    btn.disabled = false;

                return;
            }
        } catch (ex) {
            console.log("Error:", ex);
        }

        if (typeof message === "string" && message.startsWith("TITLE:")) {
            document.getElementById("headline").innerText = message.slice(6);
            return;
        }

        console.log("Message from backend:", message);
    });
</script>

</html>
